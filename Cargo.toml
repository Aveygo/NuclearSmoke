[package]
name = "nuclearsmoke"
version = "0.1.0"
edition = "2021"

[dependencies]
wseg10 = {path = "lib/wseg10"}
contours = {path = "lib/contours"}
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.76" , features = ["console"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
clap = { version = "4.5.23", features = ["derive"] }

[lib]
crate-type = ["cdylib"]
